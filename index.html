<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قرار عاشقانه 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      --pink: #ff6b9d;
      --pink-light: #ffb6c1;
      --pink-soft: #ffe4ec;
      --red: #e63946;
      --cream: #fff8f0;
      --gold: #f4a261;
      --purple: #9b5de5;
      --shadow: rgba(230, 57, 70, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', 'Aref Ruqaa', 'Caveat', cursive, sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 40%, #fce4ec 100%);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: #4a2c2a;
    }

    /* Floating hearts */
    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 2.8rem;
      opacity: 0.18;
      animation: floatHeart linear infinite;
      filter: blur(0.5px);
      user-select: none;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 0.18;
      }
      90% {
        opacity: 0.12;
      }
      100% {
        transform: translateY(-20vh) rotate(25deg) scale(1.1);
        opacity: 0;
      }
    }

    /* Main container */
    .scene {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Envelope */
    .envelope-wrapper {
      perspective: 1200px;
      width: 340px;
      height: 240px;
      position: relative;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .envelope-wrapper:hover {
      transform: scale(1.03);
    }

    .envelope {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope.open {
      transform: rotateY(180deg);
    }

    .envelope-front, .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 20px 50px var(--shadow), 0 8px 20px rgba(0,0,0,0.1);
    }

    .envelope-front {
      background: linear-gradient(145deg, #ff8fab, #ff6b9d);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: hidden;
    }

    .envelope-front::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 55%;
      background: linear-gradient(160deg, #ffb6c1, #ff8fab);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 1;
    }

    .envelope-front .seal {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: radial-gradient(circle at 30% 30%, #ffd6e0, #e63946);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 4px 15px rgba(230,57,70,0.5), inset 0 2px 6px rgba(255,255,255,0.4);
      z-index: 3;
      border: 3px solid #fff5f7;
    }

    .envelope-front .hint {
      position: absolute;
      bottom: 18px;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.9);
      font-family: 'Caveat', cursive;
      letter-spacing: 1px;
      z-index: 3;
    }

    .envelope-back {
      background: linear-gradient(145deg, #fff0f5, #ffe4ec);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 2px solid #ffb6c1;
    }

    .envelope-back .name-label {
      font-family: 'Aref Ruqaa', serif;
      font-size: 1.1rem;
      color: #c9184a;
      margin-bottom: 8px;
    }

    .envelope-back .recipient-name {
      font-family: 'Caveat', 'Aref Ruqaa', cursive;
      font-size: 2.4rem;
      font-weight: 700;
      color: #9d0208;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
      letter-spacing: 2px;
    }

    /* Paper coming out */
    .paper {
      position: absolute;
      width: 300px;
      background: linear-gradient(180deg, #fffef9 0%, #fff8f0 100%);
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15), 0 5px 15px rgba(230,57,70,0.1);
      padding: 36px 28px;
      text-align: center;
      transform-origin: bottom center;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      border: 1px solid #f5e6d3;
      transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .paper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      border-radius: 8px;
    }

    .paper.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-180px) scale(1);
    }

    .paper.folded {
      transform: translateY(40px) scale(0.85) rotateX(25deg);
      opacity: 0.6;
    }

    .paper h1 {
      font-family: 'Caveat', 'Aref Ruqaa', cursive;
      font-size: 2.1rem;
      color: #9d0208;
      margin-bottom: 12px;
      line-height: 1.3;
      font-weight: 600;
    }

    .paper .greeting {
      font-size: 1.15rem;
      color: #6d4c41;
      margin-bottom: 28px;
      font-weight: 400;
      line-height: 1.6;
    }

    .buttons-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 80px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      z-index: 2;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff6b9d, #e63946);
      color: white;
      box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
      order: 1;
    }

    .btn-yes:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 30px rgba(230, 57, 70, 0.5);
    }

    .btn-no {
      background: linear-gradient(135deg, #e0e0e0, #bdbdbd);
      color: #555;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s ease;
      user-select: none;
      order: 2;
      z-index: 3;
    }

    .btn-no:hover {
      background: linear-gradient(135deg, #d5d5d5, #b0b0b0);
    }

    /* Speech bubble */
    .speech-bubble {
      position: absolute;
      background: white;
      border: 2px solid #ff8fab;
      border-radius: 18px;
      padding: 10px 16px;
      font-size: 0.9rem;
      color: #c9184a;
      font-family: 'Vazirmatn', sans-serif;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      opacity: 0;
      transform: scale(0.7) translateY(10px);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 20;
      max-width: 180px;
      text-align: center;
      line-height: 1.4;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 8px 0;
      border-style: solid;
      border-color: #ff8fab transparent transparent;
    }

    .speech-bubble.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Page 2 - Details */
    .page-2 {
      display: none;
      width: 100%;
      max-width: 400px;
      background: linear-gradient(180deg, #fffef9 0%, #fff8f0 100%);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 8px 20px var(--shadow);
      padding: 32px 28px;
      text-align: center;
      border: 1px solid #f5e6d3;
      animation: fadeInUp 0.6s ease;
    }

    .page-2.visible {
      display: block;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-2 h2 {
      font-family: 'Caveat', 'Aref Ruqaa', cursive;
      font-size: 2rem;
      color: #9d0208;
      margin-bottom: 24px;
    }

    .option-group {
      margin-bottom: 24px;
      text-align: right;
    }

    .option-group label {
      display: block;
      font-size: 1rem;
      color: #6d4c41;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .date-options {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .date-btn {
      font-family: 'Vazirmatn', sans-serif;
      padding: 12px 24px;
      border: 2px solid #ffb6c1;
      background: white;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      color: #c9184a;
      transition: all 0.25s ease;
      font-weight: 500;
    }

    .date-btn:hover, .date-btn.selected {
      background: linear-gradient(135deg, #ff6b9d, #e63946);
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(230,57,70,0.3);
    }

    .cant-tonight {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #a1887f;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }

    .cant-tonight:hover {
      color: #e63946;
    }

    .calendar-popup, .time-popup {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #fff5f7;
      border-radius: 12px;
      border: 1px solid #ffcce0;
    }

    .calendar-popup.show, .time-popup.show {
      display: block;
      animation: fadeInUp 0.4s ease;
    }

    input[type="date"], input[type="time"] {
      font-family: 'Vazirmatn', sans-serif;
      padding: 10px 14px;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      font-size: 1rem;
      width: 100%;
      background: white;
      color: #4a2c2a;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus, input[type="time"]:focus {
      border-color: #e63946;
    }

    .activities {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .activity-btn {
      font-family: 'Vazirmatn', sans-serif;
      padding: 12px 10px;
      border: 2px solid #ffcce0;
      background: white;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95rem;
      color: #5d4037;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    .activity-btn .emoji {
      font-size: 1.5rem;
    }

    .activity-btn:hover, .activity-btn.selected {
      background: linear-gradient(135deg, #ffe4ec, #ffcce0);
      border-color: #ff6b9d;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255,107,157,0.25);
    }

    .activity-btn.special {
      grid-column: span 2;
      background: linear-gradient(135deg, #fff0f5, #ffe4ec);
      border-color: #ff6b9d;
      font-size: 1.05rem;
      padding: 16px;
      color: #c9184a;
    }

    .activity-btn.special:hover, .activity-btn.special.selected {
      background: linear-gradient(135deg, #ff6b9d, #e63946);
      color: white;
      border-color: transparent;
    }

    .note-box {
      margin-top: 8px;
    }

    .note-box textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 2px solid #ffcce0;
      border-radius: 12px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      background: white;
      color: #4a2c2a;
      transition: border-color 0.2s;
    }

    .note-box textarea:focus {
      border-color: #e63946;
    }

    .submit-btn {
      margin-top: 24px;
      width: 100%;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff6b9d, #e63946);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(230, 57, 70, 0.5);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Success message */
    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg.visible {
      display: block;
      animation: fadeInUp 0.5s ease;
    }

    .success-msg .big-heart {
      font-size: 4rem;
      animation: pulse 1.2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .success-msg h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #9d0208;
      margin: 16px 0 8px;
    }

    .success-msg p {
      color: #6d4c41;
      font-size: 1.05rem;
    }

    /* 3D card style inspired by the image */
    .card-3d {
      background: linear-gradient(145deg, #ffffff, #fff5f7);
      border-radius: 16px;
      box-shadow:
        0 25px 50px -12px rgba(230, 57, 70, 0.2),
        0 10px 20px -5px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.8);
      transform-style: preserve-3d;
    }

    /* Loading / initial state */
    .click-hint {
      margin-top: 28px;
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: #c9184a;
      opacity: 0.85;
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .envelope-wrapper {
        width: 300px;
        height: 210px;
      }
      .paper {
        width: 280px;
        padding: 28px 20px;
      }
      .paper h1 {
        font-size: 1.8rem;
      }
      .activities {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-container" id="hearts"></div>

  <div class="scene">
    <!-- Envelope -->
    <div class="envelope-wrapper" id="envelopeWrapper">
      <div class="envelope" id="envelope">
        <div class="envelope-front">
          <div class="seal">💌</div>
          <div class="hint">FAEZE</div>
        </div>
        <div class="envelope-back">
          <div class="name-label">برای</div>
          <div class="recipient-name" id="recipientName">عزیزم</div>
        </div>
      </div>
    </div>

    <!-- Paper (page 1) -->
    <div class="paper card-3d" id="paper">
      <h1>سلام <span id="nameInPaper">فائزه</span> 💕</h1>
      <p class="greeting">امشب با من سر قرار می‌آی؟</p>
      <div class="buttons-row">
        <button class="btn btn-yes" id="yesBtn">آره ❤️</button>
        <button class="btn btn-no" id="noBtn">نه</button>
        <div class="speech-bubble" id="speechBubble"></div>
      </div>
    </div>

    <!-- Page 2 -->
    <div class="page-2 card-3d" id="page2">
      <h2>کی بریم قرار؟ 🌙</h2>

      <div class="option-group">
        <div class="date-options">
          <button class="date-btn selected" id="tonightBtn" data-value="امشب">امشب ✨</button>
        </div>
        <span class="cant-tonight" id="cantTonight">امشب نمی‌تونم...</span>
        <div class="calendar-popup" id="calendarPopup">
          <label style="display:block; margin-bottom:8px; text-align:right;">تاریخ مورد نظرت:</label>
          <input type="date" id="dateInput">
        </div>
      </div>

      <div class="option-group" id="timeGroup" style="display:none;">
        <label>ساعت:</label>
        <div class="time-popup show">
          <input type="time" id="timeInput" value="20:00">
        </div>
      </div>

      <div class="option-group" id="activityGroup" style="display:none;">
        <label>دوست داری چیکار کنیم؟</label>
        <div class="activities" id="activities">
          <button class="activity-btn" data-value="تفریح"><span class="emoji">🎡</span>تفریح</button>
          <button class="activity-btn" data-value="رستوران"><span class="emoji">🍝</span>رستوران</button>
          <button class="activity-btn" data-value="تنیس"><span class="emoji">🎾</span>تنیس</button>
          <button class="activity-btn" data-value="قهوه"><span class="emoji">☕</span>قهوه</button>
          <button class="activity-btn" data-value="دور زدن"><span class="emoji">🚗</span>دور زدن</button>
          <button class="activity-btn" data-value="بیرون شهر"><span class="emoji">🌳</span>بیرون شهر</button>
          <button class="activity-btn" data-value="درینک"><span class="emoji">🍹</span>درینک</button>
          <button class="activity-btn" data-value="فیلم دیدن"><span class="emoji">🎬</span>فیلم دیدن</button>
          <button class="activity-btn special" data-value="انتخاب با خودت"><span class="emoji">💖</span>انتخاب با خودت</button>
        </div>
      </div>

      <div class="option-group" id="noteGroup" style="display:none;">
        <label>یادداشت (اختیاری):</label>
        <div class="note-box">
          <textarea id="noteInput" placeholder="هر چی دوست داری بنویس..."></textarea>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" style="display:none;">بفرست برام 💌</button>

      <div class="success-msg" id="successMsg">
        <div class="big-heart">💖</div>
        <h2>ممنونم عزیزم!</h2>
        <p>جوابت برام ایمیل شد.<br>میبینمت 🥰</p>
      </div>
    </div>

    <div class="click-hint" id="clickHint">روی پاکت کلیک کن ✨</div>
  </div>

  <script>
    // ========== CONFIG ==========
    // نام طرف مقابل رو اینجا بنویس
    const RECIPIENT_NAME = "فائزه";

    // EmailJS - مقادیر از داشبورد EmailJS
    // https://www.emailjs.com/
    const EMAILJS_PUBLIC_KEY = "lhK36dMHRblmFpm5x";
    const EMAILJS_SERVICE_ID = "service_7qgdwj8";
    const EMAILJS_TEMPLATE_ID = "template_kha5jpd";
    // ============================

    // Init EmailJS
    emailjs.init({ publicKey: "lhK36dMHRblmFpm5x" });

    // Set name
    document.getElementById('recipientName').textContent = RECIPIENT_NAME;
    document.getElementById('nameInPaper').textContent = RECIPIENT_NAME;

    // Floating hearts
    const heartsContainer = document.getElementById('hearts');
    const heartEmojis = ['💖', '💗', '💕', '💓', '❤️', '💘'];
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (2.2 + Math.random() * 1.8) + 'rem';
      heart.style.animationDuration = (12 + Math.random() * 10) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 22000);
    }
    // fewer hearts, slower
    for (let i = 0; i < 8; i++) setTimeout(createHeart, i * 1800);
    setInterval(createHeart, 3500);

    // Envelope open
    const envelope = document.getElementById('envelope');
    const envelopeWrapper = document.getElementById('envelopeWrapper');
    const paper = document.getElementById('paper');
    const clickHint = document.getElementById('clickHint');
    let isOpen = false;

    envelopeWrapper.addEventListener('click', () => {
      if (isOpen) return;
      isOpen = true;
      envelope.classList.add('open');
      clickHint.style.display = 'none';

      setTimeout(() => {
        paper.classList.add('folded');
        paper.style.opacity = '0.7';
        paper.style.transform = 'translateY(20px) scale(0.9)';
      }, 600);

      setTimeout(() => {
        paper.classList.remove('folded');
        paper.classList.add('visible');
        paper.style.transform = 'translateY(-160px) scale(1)';
        paper.style.opacity = '1';
      }, 1100);

      // Hide envelope after paper is out
      setTimeout(() => {
        envelopeWrapper.style.transition = 'opacity 0.5s, transform 0.5s';
        envelopeWrapper.style.opacity = '0';
        envelopeWrapper.style.transform = 'scale(0.8) translateY(40px)';
        setTimeout(() => envelopeWrapper.style.display = 'none', 500);
      }, 1800);
    });

    // No button behavior
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const speechBubble = document.getElementById('speechBubble');
    let noAttempts = 0;
    const funnyPhrases = [
      "هنوز خسته نشدی؟ 😏",
      "باید بگی آره! 💕",
      "نه رو ول کن دیگه 🙈",
      "منتظر آره هستم... 🥺",
      "این دکمه کار نمی‌کنه 😂",
      "آره بزن دیگه عزیزم ❤️",
      "خیلی سرسختی ها! 😝",
      "یک بار دیگه امتحان کن؟ 😉"
    ];

    function moveNoButton() {
      // حرکت کوچک‌تر و محدود تا از کنار آره خیلی دور نشه
      const maxX = 60;
      const maxY = 40;
      let newX = (Math.random() - 0.5) * maxX * 2;
      let newY = (Math.random() - 0.5) * maxY * 2;

      // کمی تغییر اندازه
      const scale = 0.92 + Math.random() * 0.2;
      noBtn.style.transform = `translate(${newX}px, ${newY}px) scale(${scale})`;
    }

    noBtn.addEventListener('mouseenter', () => {
      noAttempts++;
      moveNoButton();

      if (noAttempts >= 3) {
        const phrase = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
        speechBubble.textContent = phrase;
        speechBubble.classList.add('show');

        // position near button
        const btnRect = noBtn.getBoundingClientRect();
        const parentRect = noBtn.parentElement.getBoundingClientRect();
        speechBubble.style.left = (btnRect.left - parentRect.left + btnRect.width / 2 - 70) + 'px';
        speechBubble.style.top = (btnRect.top - parentRect.top - 55) + 'px';

        setTimeout(() => speechBubble.classList.remove('show'), 2200);
      }
    });

    // also move on click attempt
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      noAttempts++;
      moveNoButton();
      if (noAttempts >= 3) {
        const phrase = funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
        speechBubble.textContent = phrase;
        speechBubble.classList.add('show');
        setTimeout(() => speechBubble.classList.remove('show'), 2200);
      }
    });

    // Yes button -> page 2
    yesBtn.addEventListener('click', () => {
      paper.style.transition = 'all 0.5s ease';
      paper.style.opacity = '0';
      paper.style.transform = 'translateY(-160px) scale(0.9)';
      setTimeout(() => {
        paper.style.display = 'none';
        document.getElementById('page2').classList.add('visible');
        // show time & activity after a short delay for better flow
        setTimeout(() => {
          document.getElementById('timeGroup').style.display = 'block';
          document.getElementById('activityGroup').style.display = 'block';
          document.getElementById('noteGroup').style.display = 'block';
          document.getElementById('submitBtn').style.display = 'block';
        }, 300);
      }, 500);
    });

    // Date selection
    const tonightBtn = document.getElementById('tonightBtn');
    const cantTonight = document.getElementById('cantTonight');
    const calendarPopup = document.getElementById('calendarPopup');
    let selectedDate = 'امشب';

    tonightBtn.addEventListener('click', () => {
      tonightBtn.classList.add('selected');
      calendarPopup.classList.remove('show');
      selectedDate = 'امشب';
      document.getElementById('dateInput').value = '';
    });

    cantTonight.addEventListener('click', () => {
      tonightBtn.classList.remove('selected');
      calendarPopup.classList.add('show');
      // set min date to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateInput').min = today;
    });

    document.getElementById('dateInput').addEventListener('change', (e) => {
      selectedDate = e.target.value;
      tonightBtn.classList.remove('selected');
    });

    // Activities
    let selectedActivity = '';
    document.querySelectorAll('.activity-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.activity-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedActivity = btn.dataset.value;
      });
    });

    // Submit
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const time = document.getElementById('timeInput').value || 'نامشخص';
      const note = document.getElementById('noteInput').value || '—';
      const dateVal = selectedDate || 'امشب';

      if (!selectedActivity) {
        alert('لطفاً یک فعالیت انتخاب کن 😊');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ارسال...';

      const templateParams = {
        to_name: 'من',
        from_name: RECIPIENT_NAME,
        date: dateVal,
        time: time,
        activity: selectedActivity,
        note: note,
        message: `جواب قرار از ${RECIPIENT_NAME}:\nتاریخ: ${dateVal}\nساعت: ${time}\nفعالیت: ${selectedActivity}\nیادداشت: ${note}`
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

        // Show success
        document.querySelectorAll('.option-group, .submit-btn, h2').forEach(el => {
          if (el.id !== 'successMsg') el.style.display = 'none';
        });
        document.getElementById('successMsg').classList.add('visible');
      } catch (err) {
        console.error('EmailJS Error:', err);
        alert('ارسال نشد 😢\n\nخطا: ' + (err?.text || err?.message || JSON.stringify(err)) + '\n\nکنسول مرورگر (F12) رو چک کن.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'بفرست برام 💌';
      }
    });
  </script>
</body>
</html>
